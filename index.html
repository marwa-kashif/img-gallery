<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Professional Image Gallery</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>

<header>
<h1> Image Gallery</h1>
<p>Explore Beautiful Collections</p>
</header>

<div class="filter-buttons">

<button class="active" onclick="filterSelection('all')">All</button>

<button onclick="filterSelection('Nature')">Nature</button>

<button onclick="filterSelection('Flowers')">Flowers</button>

<button onclick="filterSelection('City')">City</button>

</div>

<div class="gallery">

<div class="image Nature">
<img src="images/nature1.jpg" onclick="openLightbox(this.src)">
</div>


<div class="image Nature">
<img src="images/nature2.jpg" onclick="openLightbox(this.src)">
</div>


<div class="image Flowers">
<img src="images/flower1.jpg" onclick="openLightbox(this.src)">
</div>


<div class="image Flowers">
<img src="images/flower2.jpg" onclick="openLightbox(this.src)">
</div>


<div class="image City">
<img src="images/city1.jpg" onclick="openLightbox(this.src)">
</div>


<div class="image City">
<img src="images/city2.jpg" onclick="openLightbox(this.src)">
</div>

</div>

<div id="lightbox">

<span class="close" onclick="closeLightbox()">&times;</span>

<button class="prev" onclick="changeImage(-1)">❮</button>

<img id="lightbox-img">

<button class="next" onclick="changeImage(1)">❯</button>

</div>

<script src="script.js"></script>
<footer>
    <p>© 2026 Professional Image Gallery | Designed by Marwa Kashif</p>
<p>HTML | CSS | JavaScript</p>
</footer>


</body>
</html>
